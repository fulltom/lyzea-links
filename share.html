<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thomas Vergnaud — Retrouvez-moi en ligne</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #F4F2EE;
      --surface: #FFFFFF;
      --border:  #E4E1DB;
      --accent:  #1B4FD8;
      --text:    #18181B;
      --sub:     #52525B;
      --muted:   #A1A1AA;
      --shadow:  0 1px 3px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.05);
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px 64px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 44px 36px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: var(--shadow);
      opacity: 0;
      animation: fadeUp 0.5s ease 0.1s forwards;
    }

    .label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 28px;
    }

    .qr-wrap {
      width: 200px;
      height: 200px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    #qrcode canvas,
    #qrcode img {
      display: block;
    }

    .sep {
      width: 28px;
      height: 1px;
      background: var(--border);
      margin: 28px 0;
    }

    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      text-align: center;
      color: var(--text);
    }

    .title {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--accent);
      text-align: center;
    }

    .url {
      margin-top: 24px;
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.02em;
      text-align: center;
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
      transition: color 0.2s;
    }

    .url:hover { color: var(--accent); }

    .hint {
      margin-top: 28px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 380px) {
      .card { padding: 32px 24px 32px; }
      .qr-wrap { width: 180px; height: 180px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <p class="label">Scannez pour me retrouver</p>

    <div class="qr-wrap">
      <img
        src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https%3A%2F%2Ffulltom.github.io%2Flyzea-links%2F&margin=8&color=18181B&bgcolor=FFFFFF"
        alt="QR Code — fulltom.github.io/lyzea-links"
        width="200"
        height="200"
      />
    </div>

    <div class="sep"></div>

    <h1 class="name">Thomas Vergnaud</h1>
    <p class="title">Consultant Technique Freelance</p>

    <a class="url" href="https://fulltom.github.io/lyzea-links/" target="_blank" rel="noopener noreferrer">
      fulltom.github.io/lyzea-links
    </a>

    <p class="hint">RDV · LinkedIn · Lyzea · Glossaire IA</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAXAIn1XmyRdPMbTNhCFCOcHWzXpJCMg3lBMHqSA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    new QRCode(document.getElementById("qrcode"), {
      text: "https://fulltom.github.io/lyzea-links/",
      width: 200,
      height: 200,
      colorDark: "#18181B",
      colorLight: "#FFFFFF",
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>

</body>
</html>
